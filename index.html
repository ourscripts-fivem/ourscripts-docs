<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Scripts | Documentation</title>
    <link rel="stylesheet" href="styles.css?v=2.1">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dark-theme">
    <!-- Mobile overlay -->
    <div class="mobile-overlay" id="mobile-overlay"></div>

    <!-- Mobile top bar -->
    <div class="mobile-topbar">
        <div class="mobile-topbar-left">
            <img src="assets/logo.png" alt="Logo" class="logo">
            <span class="brand-name">Our Scripts</span>
        </div>
        <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="toggleMobileMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header" id="header-logo">
                <div class="logo-container">
                    <img src="assets/logo.png?v=2.1" alt="Logo" class="logo" id="main-logo" 
                         onload="this.style.display='block'; document.getElementById('logo-placeholder').style.display='none';" 
                         onerror="this.style.display='none'; document.getElementById('logo-placeholder').style.display='flex';">
                    <div id="logo-placeholder" class="logo-placeholder" style="display:none;">OS</div>
                </div>
                <span class="brand-name">Our Scripts</span>
            </div>
            
            <nav class="sidebar-nav">
                <ul id="script-list">
                    <!-- Home Item -->
                    <li class="nav-item active" data-target="home">
                        <div class="nav-link">
                            <i data-lucide="home"></i>
                            <span>Home</span>
                        </div>
                    </li>
                    
                    <!-- Script categories will be injected here or hardcoded -->
                    <li class="nav-category" data-script="our_playerhud">
                        <div class="category-header">
                            <i data-lucide="layout"></i>
                            <span>Player HUD</span>
                            <i data-lucide="chevron-right" class="chevron"></i>
                        </div>
                        <ul class="subcategories">
                            <li data-target="our_playerhud-intro">Introduction</li>
                            <li data-target="our_playerhud-install">Installation</li>
                            <li data-target="our_playerhud-config">Configuration</li>
                        </ul>
                    </li>

                    <li class="nav-category" data-script="our_escmenu">
                        <div class="category-header">
                            <i data-lucide="monitor"></i>
                            <span>ESC Menu</span>
                            <i data-lucide="chevron-right" class="chevron"></i>
                        </div>
                        <ul class="subcategories">
                            <li data-target="our_escmenu-intro">Introduction</li>
                            <li data-target="our_escmenu-install">Installation</li>
                            <li data-target="our_escmenu-config">Configuration</li>
                        </ul>
                    </li>

                    <li class="nav-category" data-script="our_garage">
                        <div class="category-header">
                            <i data-lucide="warehouse"></i>
                            <span>Garage</span>
                            <i data-lucide="chevron-right" class="chevron"></i>
                        </div>
                        <ul class="subcategories">
                            <li data-target="our_garage-intro">Introduction</li>
                            <li data-target="our_garage-install">Installation</li>
                            <li data-target="our_garage-config">Configuration</li>
                        </ul>
                    </li>

                </ul>
            </nav>

            <div class="sidebar-footer">
                <a href="https://discord.gg/9DbRGCts5W" target="_blank" class="discord-btn">
                    <i data-lucide="message-square"></i>
                    <span>Join Discord</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content-area">
            <div id="content-viewport">
                <!-- Content will be dynamically swapped here -->
            </div>
            
            <!-- Navigation Footer (Next/Back) -->
            <footer class="content-footer">
                <button id="btn-back" class="nav-btn">
                    <i data-lucide="arrow-left"></i>
                    <span>Previous</span>
                </button>
                <div class="spacer"></div>
                <button id="btn-next" class="nav-btn">
                    <span>Next</span>
                    <i data-lucide="arrow-right"></i>
                </button>
            </footer>
        </main>
    </div>

    <script>
        function toggleMobileMenu() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('active');
        }
        document.getElementById('mobile-overlay').addEventListener('click', function() {
            document.querySelector('.sidebar').classList.remove('mobile-open');
            this.classList.remove('active');
        });
    </script>
    <script src="script.js?v=2.1"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
